name: "Droid by Factory"
description: "Flexible GitHub automation with Droid: PR reviews, @droid mentions, or custom automation, auto-detected from the event."
branding:
  icon: "at-sign"
  color: "orange"

inputs:
  # Empty config-enabled inputs mean omitted. Effective defaults are documented
  # below and resolved as built-in defaults < base .factory/review.yaml < inputs.
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "@droid"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @droid)"
    required: false
  label_trigger:
    description: "Unsupported legacy input. Label-triggered execution is disabled; use automatic_review or explicit mentions."
    required: false
    default: ""
  allowed_bots:
    description: "Comma-separated list of allowed bot usernames, or '*' to allow all bots. Empty string (default) allows no bots."
    required: false
    default: ""
  allowed_non_write_users:
    description: "Comma-separated list of usernames to allow without write permissions, or '*' to allow all users. Only works when github_token input is provided. WARNING: Use with extreme caution - this bypasses security checks and should only be used for workflows with very limited permissions (e.g., issue labeling)."
    required: false
    default: ""

  # Droid Exec configuration
  settings:
    description: "Droid Exec settings as JSON string or path to settings JSON file"
    required: false
    default: ""

  # Auth configuration
  factory_api_key:
    description: "Factory API key (required for Droid Exec runtime)"
    required: true
  github_token:
    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"
    required: false

  droid_args:
    description: "Additional arguments to pass directly to Droid CLI"
    required: false
    default: ""
  additional_permissions:
    description: "Additional GitHub permissions to request (e.g., 'actions: read')"
    required: false
    default: ""
  use_sticky_comment:
    description: "Use just one comment to deliver issue/PR comments"
    required: false
    default: "false"
  track_progress:
    description: "Force tag mode with tracking comments for pull_request and issue events. Only applicable to pull_request (opened, synchronize, ready_for_review, reopened) and issue (opened, edited, labeled, assigned) events."
    required: false
    default: "false"
  automatic_review:
    description: "Run automatic code review without a mention. Effective default false; empty inherits base config."
    required: false
    default: ""
  automatic_security_review:
    description: "Run automatic security review. Effective default inherits automatic_review; explicit false opts out."
    required: false
    default: ""
  security_model:
    description: "Advanced. Leave empty to use the review_depth preset (recommended). Falls back to review_model. If set, use a provider tier alias such as 'openai-latest-premium' or 'anthropic-latest-balanced'. Only applies to security review flows."
    required: false
    default: ""
  security_severity_threshold:
    description: "Minimum security severity: critical, high, medium (effective default), or low. Empty inherits base config."
    required: false
    default: ""
  security_block_on_critical:
    description: "Fail the check run for critical security findings, never request changes. Effective default true."
    required: false
    default: ""
  security_block_on_high:
    description: "Fail the check run for high security findings, never request changes. Effective default false."
    required: false
    default: ""
  security_notify_team:
    description: "GitHub team to @mention on critical findings (e.g., '@org/security-team')."
    required: false
    default: ""
  security_scan_schedule:
    description: "Enable scheduled security scans. Set to 'true' for schedule events to trigger full repository scans."
    required: false
    default: "false"
  security_scan_days:
    description: "Number of days of commits to scan for scheduled security scans. Only applies when security_scan_schedule is enabled."
    required: false
    default: "7"
  review_depth:
    description: "Review depth: deep (effective default) or shallow. Empty inherits base-branch config; unknown values warn and use deep."
    required: false
    default: ""
  review_model:
    description: "Advanced. Leave empty to use the review_depth preset (recommended). If set, use a provider tier alias such as 'openai-latest-premium' or 'anthropic-latest-balanced'; overrides the preset model."
    required: false
    default: ""
  reasoning_effort:
    description: "Advanced. Leave empty to use the review_depth preset (recommended). Overrides the preset reasoning effort for review flows."
    required: false
    default: ""
  include_suggestions:
    description: "Include code suggestion blocks in review comments when the fix is high-confidence. Set to 'false' to disable suggestions."
    required: false
    default: "true"
  review_candidates_path:
    description: "Path to write review candidates JSON (pass 1 of the two-pass review)."
    required: false
    default: "${{ runner.temp }}/droid-prompts/review_candidates.json"
  review_validated_path:
    description: "Path to write review validated JSON (pass 2 of the two-pass review)."
    required: false
    default: "${{ runner.temp }}/droid-prompts/review_validated.json"
  review_candidates_max_turns:
    description: "Maximum agent turns for review candidate generation (pass 1). Empty disables the cap."
    required: false
    default: "100"
  review_validator_max_turns:
    description: "Maximum agent turns for review validation (pass 2). Empty disables the cap."
    required: false
    default: "40"
  fill_model:
    description: "Advanced. Leave empty to use the default model (recommended). If set, use a provider tier alias such as 'openai-latest-premium' or 'anthropic-latest-balanced'. Only applies to fill flows."
    required: false
    default: ""
  experimental_allowed_domains:
    description: "Restrict network access to these domains only (newline-separated). If not set, no restrictions are applied. Provider domains are auto-detected."
    required: false
    default: ""
  path_to_droid_executable:
    description: "Optional path to a custom Droid CLI executable. If provided, skips automatic installation and uses this executable instead. WARNING: Using an older version may cause problems if the action begins taking advantage of new Droid Exec features. Review runs pass a JSON `--tag` (supported since the June 2026 CLI); an older CLI stores the JSON as a literal tag name and the session is not classified as a code review. This input is typically not needed unless you're debugging something specific or have unique needs in your environment."
    required: false
    default: ""
  path_to_bun_executable:
    description: "Optional path to a custom Bun executable. If provided, skips automatic Bun installation and uses this executable instead. WARNING: Using an incompatible version may cause problems if the action requires specific Bun features. This input is typically not needed unless you're debugging something specific or have unique needs in your environment."
    required: false
    default: ""
  show_full_output:
    description: "Show full JSON output from Droid Exec. WARNING: This outputs ALL Droid messages including tool execution results which may contain secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub Actions. Only enable for debugging in non-sensitive environments."
    required: false
    default: "false"
  upload_debug_artifacts:
    description: "Upload a droid-review-debug-<run_id> workflow artifact with Droid's logs, session transcripts and review prompts, for troubleshooting. Known credentials are redacted and Droid's MCP configuration is never included, but the files still contain pull request content and anything Droid printed. Anyone who can read the repository's Actions runs can download the artifact; on a public repository that is any signed-in GitHub user."
    required: false
    default: "false"
  ci_steward:
    description: "Enable CI Steward mode for workflow_run events."
    required: false
    default: "false"
  auto_fix:
    description: "Allow CI Steward to commit fixes directly to the pull request branch."
    required: false
    default: "false"
  retry_mode:
    description: "CI Steward retry policy: off, always, or smart."
    required: false
    default: "smart"
  max_retries:
    description: "Maximum reruns for each failed job and commit."
    required: false
    default: "1"
  max_fix_attempts:
    description: "Maximum consecutive fix commits from CI Steward."
    required: false
    default: "2"
  max_runs_per_pr:
    description: "Lifetime maximum CI Steward invocations for a pull request."
    required: false
    default: "10"
  steward_model:
    description: "Model used by CI Steward."
    required: false
    default: ""
  instructions:
    description: "Additional instructions for CI Steward."
    required: false
    default: ""
  config_path:
    description: "Repository CI Steward configuration path."
    required: false
    default: ".github/droid-ci.yml"

  review_summary:
    description: "Summary location: comment (effective default), description, or off. Empty inherits base-branch config."
    required: false
    default: ""
  review_summary_sections:
    description: "Visible sections. Effective default: verdict,findings,changes,details; also diagram,risk,effort. Empty inherits base config; [] disables optional sections."
    required: false
    default: ""
  review_badges:
    description: "Severity badges: image (effective default), emoji, or text. Empty inherits base config."
    required: false
    default: ""
  review_reactions:
    description: "Lifecycle reactions: eyes while running, hooray when clean, confused on failure. Effective default true; no thumbs-up/down."
    required: false
    default: ""
  review_check_run:
    description: "Create the Droid Review check run with the caller token. Effective default true; missing checks write warns once."
    required: false
    default: ""
  fail_on_severity:
    description: "Fail the check at or above P0, P1, or P2. Effective default empty (no priority gate); off explicitly disables a base-config gate."
    required: false
    default: ""
  review_incremental:
    description: "Review only new commits after the first run. Effective default true; empty inherits base config."
    required: false
    default: ""
  review_auto_resolve:
    description: "Resolve verified fixed Droid threads. Effective default true; empty inherits base config."
    required: false
    default: ""
  review_max_auto_runs:
    description: "Auto-pause after this many automatic reviews. Effective default 0 (unlimited); explicit 0 overrides base config."
    required: false
    default: ""
  show_dropped_findings:
    description: "List validation-dropped candidates and reasons. Effective default false; empty inherits base config."
    required: false
    default: ""
  include_agent_prompts:
    description: "Include untrusted-data-safe AI agent prompts. Effective default true; empty inherits base config."
    required: false
    default: ""
  fix_mode:
    description: "Droid fix publishing mode: commit (effective default), pr, or off. Commit falls back to an authorized stacked PR for protected branches; inaccessible forks are refused."
    required: false
    default: ""
  review_diagram:
    description: "What changed diagram: auto (effective default) or off. Empty inherits base config."
    required: false
    default: ""
  review_severity_threshold:
    description: "Minimum reported finding priority: P0, P1, or P2 (effective default). Empty inherits base config."
    required: false
    default: ""
  review_ignore_paths:
    description: "Comma/newline-separated ignored globs. Effective default generated files, dist/build/coverage and lock files; [] disables ignores. Empty inherits base config."
    required: false
    default: ""
  review_auto_triggers:
    description: "Automatic PR event actions. Effective default opened,reopened,synchronize,ready_for_review. [] disables automatic event triggers."
    required: false
    default: ""
  review_drafts:
    description: "Review draft PRs automatically. Effective default false; manual review commands still run."
    required: false
    default: ""
  review_effort:
    description: "Show an evidence-based effort estimate. Effective default false; empty inherits base config."
    required: false
    default: ""
  review_category_chips:
    description: "Show finding category chips. Effective default false; empty inherits base config."
    required: false
    default: ""
  review_suggest_reviewers:
    description: "Suggest CODEOWNERS reviewers, never assign them. Effective default false."
    required: false
    default: ""
  review_pre_merge_checks:
    description: "Opt-in checks: title,description,linked_issue. Effective default none; [] explicitly clears base checks."
    required: false
    default: ""

outputs:
  github_token:
    description: "The GitHub token used by the action. A Factory Droid App token the action minted is revoked when the action finishes, so later steps that need a token should pass their own github_token."
    value: ${{ steps.prepare.outputs.github_token }}

runs:
  using: "composite"
  steps:
    - name: Install Bun
      if: inputs.path_to_bun_executable == ''
      uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # https://github.com/oven-sh/setup-bun/releases/tag/v2.0.2
      with:
        bun-version: 1.2.11

    - name: Setup Custom Bun Path
      if: inputs.path_to_bun_executable != ''
      shell: bash
      run: |
        echo "Using custom Bun executable: ${{ inputs.path_to_bun_executable }}"
        # Add the directory containing the custom executable to PATH
        BUN_DIR=$(dirname "${{ inputs.path_to_bun_executable }}")
        echo "$BUN_DIR" >> "$GITHUB_PATH"

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${GITHUB_ACTION_PATH}
        bun install

    # Every `bun run` passes --config=/dev/null --env-file=/dev/null. Bun
    # otherwise loads bunfig.toml (including preload scripts) and .env files
    # from the working directory, which is the caller's checkout, into a
    # process that holds the job's credentials.
    - name: Prepare action
      id: prepare
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        bun --config=/dev/null --env-file=/dev/null run ${GITHUB_ACTION_PATH}/src/entrypoints/prepare.ts
      env:
        REVIEW_CONFIG_JSON: ""
        WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        FACTORY_API_KEY: ${{ inputs.factory_api_key }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        LABEL_TRIGGER: ${{ inputs.label_trigger }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        SCOPE_APP_TOKEN: "true"
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        ALLOWED_NON_WRITE_USERS: ${{ inputs.allowed_non_write_users }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        USE_STICKY_COMMENT: ${{ inputs.use_sticky_comment }}
        DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
        TRACK_PROGRESS: ${{ inputs.track_progress }}
        AUTOMATIC_REVIEW: ${{ inputs.automatic_review }}
        AUTOMATIC_SECURITY_REVIEW: ${{ inputs.automatic_security_review }}
        SECURITY_MODEL: ${{ inputs.security_model }}
        SECURITY_SEVERITY_THRESHOLD: ${{ inputs.security_severity_threshold }}
        SECURITY_BLOCK_ON_CRITICAL: ${{ inputs.security_block_on_critical }}
        SECURITY_BLOCK_ON_HIGH: ${{ inputs.security_block_on_high }}
        SECURITY_NOTIFY_TEAM: ${{ inputs.security_notify_team }}
        SECURITY_SCAN_SCHEDULE: ${{ inputs.security_scan_schedule }}
        SECURITY_SCAN_DAYS: ${{ inputs.security_scan_days }}
        CI_STEWARD: ${{ inputs.ci_steward }}
        AUTO_FIX: ${{ inputs.auto_fix }}
        RETRY_MODE: ${{ inputs.retry_mode }}
        MAX_RETRIES: ${{ inputs.max_retries }}
        MAX_FIX_ATTEMPTS: ${{ inputs.max_fix_attempts }}
        MAX_RUNS_PER_PR: ${{ inputs.max_runs_per_pr }}
        STEWARD_MODEL: ${{ inputs.steward_model }}
        INSTRUCTIONS: ${{ inputs.instructions }}
        CONFIG_PATH: ${{ inputs.config_path }}
        REVIEW_DEPTH: ${{ inputs.review_depth }}
        REVIEW_MODEL: ${{ inputs.review_model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        REVIEW_CANDIDATES_PATH: ${{ inputs.review_candidates_path }}
        REVIEW_VALIDATED_PATH: ${{ inputs.review_validated_path }}
        FILL_MODEL: ${{ inputs.fill_model }}
        ADDITIONAL_PERMISSIONS: ${{ inputs.additional_permissions }}
        DROID_ARGS: ${{ inputs.droid_args }}
        INCLUDE_SUGGESTIONS: ${{ inputs.include_suggestions }}
        ALL_INPUTS: ${{ toJson(inputs) }}

        REVIEW_SUMMARY: ${{ inputs.review_summary }}
        REVIEW_SUMMARY_SECTIONS: ${{ inputs.review_summary_sections }}
        REVIEW_BADGES: ${{ inputs.review_badges }}
        REVIEW_REACTIONS: ${{ inputs.review_reactions }}
        REVIEW_CHECK_RUN: ${{ inputs.review_check_run }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        REVIEW_INCREMENTAL: ${{ inputs.review_incremental }}
        REVIEW_AUTO_RESOLVE: ${{ inputs.review_auto_resolve }}
        REVIEW_MAX_AUTO_RUNS: ${{ inputs.review_max_auto_runs }}
        SHOW_DROPPED_FINDINGS: ${{ inputs.show_dropped_findings }}
        INCLUDE_AGENT_PROMPTS: ${{ inputs.include_agent_prompts }}
        FIX_MODE: ${{ inputs.fix_mode }}
        REVIEW_DIAGRAM: ${{ inputs.review_diagram }}
        REVIEW_SEVERITY_THRESHOLD: ${{ inputs.review_severity_threshold }}
        REVIEW_IGNORE_PATHS: ${{ inputs.review_ignore_paths }}
        REVIEW_AUTO_TRIGGERS: ${{ inputs.review_auto_triggers }}
        REVIEW_DRAFTS: ${{ inputs.review_drafts }}
        REVIEW_EFFORT: ${{ inputs.review_effort }}
        REVIEW_CATEGORY_CHIPS: ${{ inputs.review_category_chips }}
        REVIEW_SUGGEST_REVIEWERS: ${{ inputs.review_suggest_reviewers }}
        REVIEW_PRE_MERGE_CHECKS: ${{ inputs.review_pre_merge_checks }}
    - name: Install Base Action Dependencies
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true'
      shell: bash
      run: |
        echo "Installing base-action dependencies..."
        cd ${GITHUB_ACTION_PATH}/base-action
        bun install
        echo "Base-action dependencies installed"
        cd -

    - name: Install Droid CLI
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true' && inputs.path_to_droid_executable == ''
      shell: bash
      run: |
        echo "Installing Droid CLI..."
        curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/droid" --version

    - name: Setup Custom Droid Path
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true' && inputs.path_to_droid_executable != ''
      shell: bash
      run: |
        echo "Using custom Droid executable: ${{ inputs.path_to_droid_executable }}"
        DROID_DIR=$(dirname "${{ inputs.path_to_droid_executable }}")
        echo "$DROID_DIR" >> "$GITHUB_PATH"

    - name: Setup Custom Droids
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true'
      shell: bash
      run: |
        echo "Setting up custom droids..."
        mkdir -p ~/.factory/droids
        if [ -d "${GITHUB_ACTION_PATH}/.factory/droids" ]; then
          cp -r ${GITHUB_ACTION_PATH}/.factory/droids/* ~/.factory/droids/
          echo "Copied custom droids to ~/.factory/droids/"
          ls -la ~/.factory/droids/
        else
          echo "No custom droids found in action"
        fi

    - name: Setup Network Restrictions
      if: steps.prepare.outputs.contains_trigger == 'true' && inputs.experimental_allowed_domains != ''
      shell: bash
      run: |
        chmod +x ${GITHUB_ACTION_PATH}/scripts/setup-network-restrictions.sh
        ${GITHUB_ACTION_PATH}/scripts/setup-network-restrictions.sh
      env:
        EXPERIMENTAL_ALLOWED_DOMAINS: ${{ inputs.experimental_allowed_domains }}

    - name: Install Security Plugin
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true' && steps.prepare.outputs.install_security_skills == 'true'
      shell: bash
      run: |
        echo "Installing security-engineer plugin from factory-plugins marketplace..."
        droid plugin marketplace add https://github.com/Factory-AI/factory-plugins 2>/dev/null || true
        droid plugin install security-engineer@factory-plugins --scope user 2>/dev/null || {
          echo "Warning: Could not install security-engineer plugin. Security review may have limited functionality."
        }
        echo "Security plugin installation complete"

    - name: Freeze trusted Droid executable
      id: review_cli
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true'
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        bun --config=/dev/null --env-file=/dev/null run ${GITHUB_ACTION_PATH}/src/entrypoints/freeze-review-cli.ts
      env:
        BASH_ENV: ""
        ENV: ""
        NODE_OPTIONS: ""
        BUN_OPTIONS: ""
        NODE_PATH: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        INPUT_PATH_TO_DROID_EXECUTABLE: ${{ inputs.path_to_droid_executable }}

    - name: Review lifecycle candidates
      if: steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true' && steps.prepare.outputs.command_mode == '' && steps.prepare.outputs.run_code_review == 'true'
      continue-on-error: true
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        # Execute only the publisher and runtime frozen before model execution.
        for path in "$REVIEW_PUBLISHER_PATH" "$REVIEW_RUNTIME_PATH"; do
          case "$path" in /*) ;; *) echo "Refusing a non-absolute review executable"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "Refusing a missing or symlinked review executable"
            exit 1
          fi
        done
        if [[ ! "$REVIEW_PUBLISHER_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$REVIEW_RUNTIME_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Missing trusted review executable digest"
          exit 1
        fi
        publisher_hash=$(/usr/bin/sha256sum -- "$REVIEW_PUBLISHER_PATH")
        runtime_hash=$(/usr/bin/sha256sum -- "$REVIEW_RUNTIME_PATH")
        if [ "${publisher_hash%% *}" != "$REVIEW_PUBLISHER_SHA256" ] || [ "${runtime_hash%% *}" != "$REVIEW_RUNTIME_SHA256" ]; then
          echo "Review publisher or runtime changed during execution; refusing to publish"
          exit 1
        fi
        /usr/bin/env -i \
          PATH=/usr/bin:/bin \
          GITHUB_OUTPUT="${GITHUB_OUTPUT:-}" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH:-}" \
          RUNNER_TEMP="${RUNNER_TEMP:-}" \
          GITHUB_ACTOR="${GITHUB_ACTOR:-}" \
          GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
          GITHUB_RUN_ID="${GITHUB_RUN_ID:-}" \
          GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}" \
          GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-}" \
          GITHUB_API_URL="${GITHUB_API_URL:-}" \
          REVIEW_RUNTIME_SHA256="${REVIEW_RUNTIME_SHA256:-}" \
          REVIEW_RUNTIME_PATH="${REVIEW_RUNTIME_PATH:-}" \
          REVIEW_PUBLISHER_SHA256="${REVIEW_PUBLISHER_SHA256:-}" \
          REVIEW_PUBLISHER_PATH="${REVIEW_PUBLISHER_PATH:-}" \
          REVIEW_SKIPPED="${REVIEW_SKIPPED:-}" \
          REVIEW_POSTED="${REVIEW_POSTED:-}" \
          REVIEW_AUTOMATIC="${REVIEW_AUTOMATIC:-}" \
          REVIEW_SECURITY_ONLY="${REVIEW_SECURITY_ONLY:-}" \
          REVIEW_INCREMENTAL_BASE_SHA="${REVIEW_INCREMENTAL_BASE_SHA:-}" \
          REVIEW_CONFIG_JSON="${REVIEW_CONFIG_JSON:-}" \
          REVIEW_REACTION_KIND="${REVIEW_REACTION_KIND:-}" \
          REVIEW_REACTION_TARGET="${REVIEW_REACTION_TARGET:-}" \
          REVIEW_REACTION_ID="${REVIEW_REACTION_ID:-}" \
          REVIEW_STARTED_AT="${REVIEW_STARTED_AT:-}" \
          REVIEW_CHECK_ID="${REVIEW_CHECK_ID:-}" \
          REVIEW_COMMENT_ID="${REVIEW_COMMENT_ID:-}" \
          REVIEW_BASE_SHA="${REVIEW_BASE_SHA:-}" \
          REPO_OWNER="${REPO_OWNER:-}" \
          REPO_NAME="${REPO_NAME:-}" \
          PR_NUMBER="${PR_NUMBER:-}" \
          REVIEW_HEAD_SHA="${REVIEW_HEAD_SHA:-}" \
          GITHUB_TOKEN="${GITHUB_TOKEN:-}" \
          WORKFLOW_GITHUB_TOKEN="${WORKFLOW_GITHUB_TOKEN:-}" \
          REVIEW_PHASE="${REVIEW_PHASE:-}" \
          "$REVIEW_RUNTIME_PATH" --config=/dev/null --env-file=/dev/null run "$REVIEW_PUBLISHER_PATH"
      env:
        RUNNER_TEMP: ${{ runner.temp }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        REVIEW_RUNTIME_SHA256: ${{ steps.prepare.outputs.review_runtime_sha256 }}
        REVIEW_RUNTIME_PATH: ${{ steps.prepare.outputs.review_runtime_path }}
        REVIEW_PUBLISHER_SHA256: ${{ steps.prepare.outputs.review_lifecycle_publisher_sha256 }}
        REVIEW_PUBLISHER_PATH: ${{ steps.prepare.outputs.review_lifecycle_publisher_path }}
        REVIEW_SKIPPED: ${{ steps.prepare.outputs.review_skipped }}
        REVIEW_POSTED: ${{ steps.post_review.outputs.review_posted }}
        REVIEW_AUTOMATIC: ${{ steps.prepare.outputs.review_automatic }}
        REVIEW_SECURITY_ONLY: ${{ steps.prepare.outputs.review_security_only }}
        REVIEW_INCREMENTAL_BASE_SHA: ${{ steps.prepare.outputs.review_incremental_base_sha }}
        REVIEW_CONFIG_JSON: ${{ steps.prepare.outputs.review_config_json }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
