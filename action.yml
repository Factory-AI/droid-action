        DROID_SUCCESS: ${{ (steps.prepare.outputs.run_code_review == 'true' && ((steps.prepare_validator.outputs.validator_should_run == 'false' && steps.droid.outputs.conclusion == 'success') || (steps.prepare_validator.outputs.validator_should_run != 'false' && steps.droid.outputs.conclusion == 'success' && steps.droid_validator.outputs.conclusion == 'success' && steps.post_review.outputs.conclusion == 'success'))) || (steps.prepare.outputs.run_code_review != 'true' && steps.droid.outputs.conclusion == 'success') }}
        TRIGGER_USERNAME: ${{ github.event.comment.user.login || github.event.issue.user.login || github.event.pull_request.user.login || github.event.sender.login || github.triggering_actor || github.actor || '' }}
        PREPARE_SUCCESS: ${{ steps.prepare.outcome == 'success' }}
        PREPARE_ERROR: ${{ steps.prepare.outputs.prepare_error || '' }}
        DROID_ERROR_MESSAGE: ${{ steps.droid.outputs.error_message || '' }}
        DROID_VALIDATOR_ERROR_MESSAGE: ${{ steps.droid_validator.outputs.error_message || '' }}
        DROID_POST_ERROR_MESSAGE: ${{ steps.post_review.outputs.error_message || '' }}
        REVIEW_POST_RESULTS_PATH: ${{ runner.temp }}/droid-prompts/review_post_results.json
        MODEL_FALLBACK_NOTE: ${{ steps.prepare.outputs.model_fallback_note || steps.prepare_validator.outputs.model_fallback_note || steps.droid.outputs.model_fallback_note || steps.droid_validator.outputs.model_fallback_note || '' }}
        USE_STICKY_COMMENT: ${{ inputs.use_sticky_comment }}
        TRACK_PROGRESS: ${{ inputs.track_progress }}
        AUTOMATIC_REVIEW: ${{ inputs.automatic_review || env.AUTOMATIC_REVIEW }}
        AUTOMATIC_SECURITY_REVIEW: ${{ steps.prepare.outputs.run_security_review }}

    - name: Review lifecycle finalize
      if: always() && steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.command_mode == '' && github.event_name != 'workflow_run' && steps.prepare.outputs.run_code_review == 'true'
      continue-on-error: true
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        # Execute only the publisher and runtime frozen before model execution.
        for path in "$REVIEW_PUBLISHER_PATH" "$REVIEW_RUNTIME_PATH"; do
          case "$path" in /*) ;; *) echo "Refusing a non-absolute review executable"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "Refusing a missing or symlinked review executable"
            exit 1
          fi
        done
        if [[ ! "$REVIEW_PUBLISHER_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$REVIEW_RUNTIME_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Missing trusted review executable digest"
          exit 1
        fi
        publisher_hash=$(/usr/bin/sha256sum -- "$REVIEW_PUBLISHER_PATH")
        runtime_hash=$(/usr/bin/sha256sum -- "$REVIEW_RUNTIME_PATH")
        if [ "${publisher_hash%% *}" != "$REVIEW_PUBLISHER_SHA256" ] || [ "${runtime_hash%% *}" != "$REVIEW_RUNTIME_SHA256" ]; then
          echo "Review publisher or runtime changed during execution; refusing to publish"
          exit 1
        fi
        /usr/bin/env -i \
          PATH=/usr/bin:/bin \
          GITHUB_OUTPUT="${GITHUB_OUTPUT:-}" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH:-}" \
          RUNNER_TEMP="${RUNNER_TEMP:-}" \
          GITHUB_ACTOR="${GITHUB_ACTOR:-}" \
          GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
          GITHUB_RUN_ID="${GITHUB_RUN_ID:-}" \
          GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}" \
          GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-}" \
          GITHUB_API_URL="${GITHUB_API_URL:-}" \
          REVIEW_RUNTIME_SHA256="${REVIEW_RUNTIME_SHA256:-}" \
          REVIEW_RUNTIME_PATH="${REVIEW_RUNTIME_PATH:-}" \
          REVIEW_PUBLISHER_SHA256="${REVIEW_PUBLISHER_SHA256:-}" \
          REVIEW_PUBLISHER_PATH="${REVIEW_PUBLISHER_PATH:-}" \
          REVIEW_SKIPPED="${REVIEW_SKIPPED:-}" \
          REVIEW_POSTED="${REVIEW_POSTED:-}" \
          REVIEW_AUTOMATIC="${REVIEW_AUTOMATIC:-}" \
          REVIEW_SECURITY_ONLY="${REVIEW_SECURITY_ONLY:-}" \
          REVIEW_INCREMENTAL_BASE_SHA="${REVIEW_INCREMENTAL_BASE_SHA:-}" \
          REVIEW_CONFIG_JSON="${REVIEW_CONFIG_JSON:-}" \
          REVIEW_REACTION_KIND="${REVIEW_REACTION_KIND:-}" \
          REVIEW_REACTION_TARGET="${REVIEW_REACTION_TARGET:-}" \
          REVIEW_REACTION_ID="${REVIEW_REACTION_ID:-}" \
          REVIEW_STARTED_AT="${REVIEW_STARTED_AT:-}" \
          REVIEW_CHECK_ID="${REVIEW_CHECK_ID:-}" \
          REVIEW_COMMENT_ID="${REVIEW_COMMENT_ID:-}" \
          REVIEW_BASE_SHA="${REVIEW_BASE_SHA:-}" \
          REPO_OWNER="${REPO_OWNER:-}" \
          REPO_NAME="${REPO_NAME:-}" \
          PR_NUMBER="${PR_NUMBER:-}" \
          REVIEW_HEAD_SHA="${REVIEW_HEAD_SHA:-}" \
          GITHUB_TOKEN="${GITHUB_TOKEN:-}" \
          WORKFLOW_GITHUB_TOKEN="${WORKFLOW_GITHUB_TOKEN:-}" \
          REVIEW_PHASE="${REVIEW_PHASE:-}" \
          DROID_SUCCESS="${DROID_SUCCESS:-}" \
          DROID_ERROR_MESSAGE="${DROID_ERROR_MESSAGE:-}" \
          DROID_VALIDATOR_ERROR_MESSAGE="${DROID_VALIDATOR_ERROR_MESSAGE:-}" \
          DROID_POST_ERROR_MESSAGE="${DROID_POST_ERROR_MESSAGE:-}" \
          PREPARE_ERROR="${PREPARE_ERROR:-}" \
          "$REVIEW_RUNTIME_PATH" --config=/dev/null --env-file=/dev/null run "$REVIEW_PUBLISHER_PATH"
      env:
        RUNNER_TEMP: ${{ runner.temp }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        REVIEW_RUNTIME_SHA256: ${{ steps.prepare.outputs.review_runtime_sha256 }}
        REVIEW_RUNTIME_PATH: ${{ steps.prepare.outputs.review_runtime_path }}
        REVIEW_PUBLISHER_SHA256: ${{ steps.prepare.outputs.review_lifecycle_publisher_sha256 }}
        REVIEW_PUBLISHER_PATH: ${{ steps.prepare.outputs.review_lifecycle_publisher_path }}
        REVIEW_SKIPPED: ${{ steps.prepare.outputs.review_skipped }}
        REVIEW_POSTED: ${{ steps.post_review.outputs.review_posted }}
        REVIEW_AUTOMATIC: ${{ steps.prepare.outputs.review_automatic }}
        REVIEW_SECURITY_ONLY: ${{ steps.prepare.outputs.review_security_only }}
        REVIEW_INCREMENTAL_BASE_SHA: ${{ steps.prepare.outputs.review_incremental_base_sha }}
        REVIEW_CONFIG_JSON: ${{ steps.prepare.outputs.review_config_json }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        REVIEW_REACTION_KIND: ${{ steps.prepare.outputs.review_reaction_kind }}
        REVIEW_REACTION_TARGET: ${{ steps.prepare.outputs.review_reaction_target }}
        REVIEW_REACTION_ID: ${{ steps.prepare.outputs.review_reaction_id }}
        REVIEW_STARTED_AT: ${{ steps.prepare.outputs.review_started_at }}
        REVIEW_CHECK_ID: ${{ steps.prepare.outputs.review_check_id }}
        REVIEW_COMMENT_ID: ${{ steps.prepare.outputs.review_comment_id }}
        REVIEW_BASE_SHA: ${{ steps.prepare.outputs.review_base_sha }}
        REPO_OWNER: ${{ steps.prepare.outputs.repo_owner }}
        REPO_NAME: ${{ steps.prepare.outputs.repo_name }}
        PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        REVIEW_HEAD_SHA: ${{ steps.prepare.outputs.review_head_sha }}
        GITHUB_TOKEN: ${{ steps.prepare.outputs.github_token }}
        WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        REVIEW_PHASE: finalize
        DROID_SUCCESS: ${{ steps.droid.outputs.conclusion == 'success' && (steps.prepare_validator.outputs.validator_should_run == 'false' || (steps.droid_validator.outputs.conclusion == 'success' && steps.post_review.outputs.conclusion == 'success')) }}
        DROID_ERROR_MESSAGE: ${{ steps.droid.outputs.error_message || '' }}
        DROID_VALIDATOR_ERROR_MESSAGE: ${{ steps.droid_validator.outputs.error_message || '' }}
        DROID_POST_ERROR_MESSAGE: ${{ steps.post_review.outputs.error_message || '' }}
        PREPARE_ERROR: ${{ steps.prepare.outputs.prepare_error || '' }}

    # Workflow artifacts are public on public repositories, so only a redacted
    # copy of selected files is ever staged, and only when asked for.
    - name: Collect debug files
      id: collect_debug
      if: always() && inputs.upload_debug_artifacts == 'true' && steps.prepare.outputs.contains_trigger == 'true' && steps.prepare.outputs.steward_skipped != 'true'
      continue-on-error: true
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        for path in "${TRUSTED_TAIL_PATH:-}" "${TRUSTED_RUNTIME_PATH:-}"; do
          case "$path" in /*) ;; *) echo "::warning::Trusted debug collector is unavailable; refusing a mutable fallback"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "::warning::Refusing a missing or symlinked debug executable"
            exit 1
          fi
        done
        if [[ ! "${TRUSTED_TAIL_SHA256:-}" =~ ^[a-f0-9]{64}$ ]] || [[ ! "${TRUSTED_RUNTIME_SHA256:-}" =~ ^[a-f0-9]{64}$ ]]; then
          echo "::warning::Missing trusted debug executable digest"
          exit 1
        fi
        publisher_hash=$(/usr/bin/sha256sum -- "$TRUSTED_TAIL_PATH")
        runtime_hash=$(/usr/bin/sha256sum -- "$TRUSTED_RUNTIME_PATH")
        if [ "${publisher_hash%% *}" != "$TRUSTED_TAIL_SHA256" ] || [ "${runtime_hash%% *}" != "$TRUSTED_RUNTIME_SHA256" ]; then
          echo "::warning::Debug collector or runtime changed; refusing to collect"
          exit 1
        fi
        /usr/bin/env -i \
          PATH=/usr/bin:/bin HOME="${HOME:-}" RUNNER_TEMP="${RUNNER_TEMP:-}" DEBUG_ARTIFACTS_DIR="${DEBUG_ARTIFACTS_DIR:-}" \
          GITHUB_TOKEN="${GITHUB_TOKEN:-}" GH_TOKEN="${GH_TOKEN:-}" \
          OVERRIDE_GITHUB_TOKEN="${OVERRIDE_GITHUB_TOKEN:-}" DEFAULT_WORKFLOW_TOKEN="${DEFAULT_WORKFLOW_TOKEN:-}" \
          WORKFLOW_GITHUB_TOKEN="${WORKFLOW_GITHUB_TOKEN:-}" FACTORY_API_KEY="${FACTORY_API_KEY:-}" \
          ACTIONS_ID_TOKEN_REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ACTIONS_RUNTIME_TOKEN="${ACTIONS_RUNTIME_TOKEN:-}" \
          "$TRUSTED_RUNTIME_PATH" --config=/dev/null --env-file=/dev/null run "$TRUSTED_TAIL_PATH"
      env:
        TRUSTED_TAIL_PATH: ${{ steps.prepare.outputs.review_debug_publisher_path }}
        TRUSTED_TAIL_SHA256: ${{ steps.prepare.outputs.review_debug_publisher_sha256 }}
        TRUSTED_RUNTIME_PATH: ${{ steps.prepare.outputs.review_runtime_path }}
        TRUSTED_RUNTIME_SHA256: ${{ steps.prepare.outputs.review_runtime_sha256 }}
        HOME: ${{ steps.review_cli.outputs.review_home }}
        RUNNER_TEMP: ${{ runner.temp }}
        WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        DEBUG_ARTIFACTS_DIR: ${{ runner.temp }}/droid-debug-artifacts
        # Passed only so their values can be redacted from the staged files.
        GITHUB_TOKEN: ${{ steps.prepare.outputs.github_token }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
        FACTORY_API_KEY: ${{ inputs.factory_api_key }}

    - name: Upload debug artifacts
      if: always() && steps.collect_debug.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: droid-review-debug-${{ github.run_id }}
        path: ${{ runner.temp }}/droid-debug-artifacts/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7

    # Must stay the last step: everything above may still call GitHub with the
    # token. A provided github_token belongs to the caller and is left alone.
    - name: Revoke GitHub App token
      if: always() && inputs.github_token == ''
      continue-on-error: true
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        for path in "${TRUSTED_TAIL_PATH:-}" "${TRUSTED_RUNTIME_PATH:-}"; do
          case "$path" in /*) ;; *) echo "::warning::Trusted token cleanup is unavailable; no mutable fallback will run"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "::warning::Refusing a missing or symlinked token cleanup executable"
            exit 1
          fi
        done
        if [[ ! "${TRUSTED_TAIL_SHA256:-}" =~ ^[a-f0-9]{64}$ ]] || [[ ! "${TRUSTED_RUNTIME_SHA256:-}" =~ ^[a-f0-9]{64}$ ]]; then
          echo "::warning::Missing trusted token cleanup executable digest"
          exit 1
        fi
        publisher_hash=$(/usr/bin/sha256sum -- "$TRUSTED_TAIL_PATH")
        runtime_hash=$(/usr/bin/sha256sum -- "$TRUSTED_RUNTIME_PATH")
        if [ "${publisher_hash%% *}" != "$TRUSTED_TAIL_SHA256" ] || [ "${runtime_hash%% *}" != "$TRUSTED_RUNTIME_SHA256" ]; then
          echo "::warning::Token cleanup publisher or runtime changed; refusing to execute"
          exit 1
        fi
        /usr/bin/env -i \
          PATH=/usr/bin:/bin \
          GITHUB_TOKEN="${GITHUB_TOKEN:-}" OVERRIDE_GITHUB_TOKEN="${OVERRIDE_GITHUB_TOKEN:-}" GITHUB_API_URL="${GITHUB_API_URL:-}" \
          "$TRUSTED_RUNTIME_PATH" --config=/dev/null --env-file=/dev/null run "$TRUSTED_TAIL_PATH"
      env:
        TRUSTED_TAIL_PATH: ${{ steps.prepare.outputs.review_revoke_publisher_path }}
        TRUSTED_TAIL_SHA256: ${{ steps.prepare.outputs.review_revoke_publisher_sha256 }}
        TRUSTED_RUNTIME_PATH: ${{ steps.prepare.outputs.review_runtime_path }}
        TRUSTED_RUNTIME_SHA256: ${{ steps.prepare.outputs.review_runtime_sha256 }}
        GITHUB_API_URL: ${{ github.api_url }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ steps.prepare.outputs.github_token }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
