# Factory review configuration, read from the branch a pull request merges
# into, never from the pull request itself. Factory's PR risk assessment
# reads `rules`; Droid Auto Review leaves that key to Factory.
rules:
  # Every pull request is assessed and gets a risk comment. The Droid App may
  # approve a pull request whose overall risk is minimal or low; one rated
  # medium or high waits for a human. Setting approve_pr: false stops every
  # approval and keeps the comments (shadow mode).
  - risk_assessment:
      approve_risk_level: low
