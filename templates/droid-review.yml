# GitLab CI/CD Component: droid-review
#
# Automated Droid code review on merge requests. Two-pass pipeline
# (candidate generation + validator), inline MR comments, sticky tracking
# note with telemetry, optional parallel security-reviewer subagent.
#
# Everything that touches the MR goes through the GitLab REST API from CI,
# never from inside the model: prepare fetches the diff/notes/description
# onto disk, the two `droid exec` passes only read those files and write
# JSON, then `gitlab-post-review` posts the approved findings and
# `gitlab-update-comment-link` renders the tracking note.
#
# The passes get no MR tool (`--enabled-tools` below), and GITLAB_TOKEN is
# unset in the environment they start with. That is not a security boundary:
# they keep `Execute` for investigating the code, run as the same OS user as
# the job shell, and can read the token (and every other CI variable this job
# holds, including FACTORY_API_KEY and CI_JOB_TOKEN) from their parent
# processes' /proc/<pid>/environ, then reach the network. Treat the review job
# like any other CI job that runs untrusted code, and scope the credentials it
# receives accordingly (see docs/gitlab-setup.md).
#
# Every `bun run` passes `--config=/dev/null --env-file=/dev/null`: Bun reads
# bunfig.toml (including `preload` scripts) and .env files from the current
# directory, which here is the MR checkout, so without them a merge request
# could run code with the job's credentials or override FACTORY_API_BASE_URL.
#
# Consumed via:
#   include:
#     - project: "factory-components/droid-action"
#       ref: main
#       file: "/templates/droid-review.yml"
#
# Or, once Catalog-published:
#   include:
#     - component: gitlab.com/factory-components/droid-action/droid-review@<tag>
#
# Catalog requires this file to live at `templates/<name>.yml`.
# See ./README.md for the full directory contract.

spec:
  inputs:
    automatic_review:
      description: "Run code review automatically on every MR event."
      default: ""
    review_depth:
      description: |
        Review depth preset: `shallow` (fast) or `deep` (thorough). Factory
        keeps each preset on its recommended model, so this is the only
        model setting most projects need.
      default: ""
    review_model:
      description: |
        Advanced. Leave empty to use the `review_depth` preset (recommended).
        If set, use a provider tier alias such as `openai-latest-premium` or `anthropic-latest-balanced`.
      default: ""
    reasoning_effort:
      description: "Advanced. Leave empty to use the `review_depth` preset (recommended)."
      default: ""
    include_suggestions:
      description: |
        Include code suggestion blocks in review comments when the fix is
        high-confidence. Set to "false" to disable suggestion blocks
        entirely. Mirrors the GitHub action's `include_suggestions` input.
      default: "true"
    automatic_security_review:
      description: |
        Automatically run a security-focused review subagent in parallel
        with the regular code review on every MR pipeline. Findings are
        prefixed with `[security]` and posted alongside code-review
        comments. Mirrors the GitHub action's `automatic_security_review`
        input. The security-review skill is built into the Droid CLI; no
        plugin install is required. Only runs when `automatic_review` is
        enabled. Set to "false" to keep code-only review.
      default: ""
    security_block_on_critical:
      description: |
        When the security reviewer reports CRITICAL findings, block merge
        of the MR. Mirrors the GitHub action's `security_block_on_critical`
        input. Defaults to `"true"`.
      default: ""
    security_block_on_high:
      description: |
        When the security reviewer reports HIGH findings, block merge of
        the MR. Mirrors the GitHub action's `security_block_on_high` input.
        Defaults to `"false"`.
      default: ""
    review_summary:
      description: "comment, description, or off. Effective default: comment."
      default: ""
    review_summary_sections:
      description: "Comma-separated sections. Default: verdict,findings,changes,details."
      default: ""
    review_badges:
      description: "text, image, or emoji. Effective default: text."
      default: ""
    review_reactions:
      description: "eyes / tada (clean) / confused lifecycle awards. Default: true."
      default: ""
    review_check_run:
      description: "Publish Droid Review commit status (GitLab check-run analog). Default: true."
      default: ""
    fail_on_severity:
      description: "Fail commit status at or above P0, P1, or P2. Empty default disables; off clears base config."
      default: ""
    review_incremental:
      description: "Review changes since the last successful review. Default: true."
      default: ""
    review_auto_resolve:
      description: "Resolve discussions only after explicit fixed validation. Default: true."
      default: ""
    review_max_auto_runs:
      description: "Pause after N automatic reviews. Default: 0 (unlimited)."
      default: ""
    show_dropped_findings:
      description: "List validator-dropped candidates and reasons. Default: false."
      default: ""
    include_agent_prompts:
      description: "Include untrusted-data-safe AI-agent prompt blocks. Default: true."
      default: ""
    fix_mode:
      description: "commit, pr (stacked MR), or off. Effective default: commit."
      default: ""
    review_diagram:
      description: "auto or off. Effective default: auto."
      default: ""
    review_severity_threshold:
      description: "Minimum priority to report: P0, P1, or P2. Default: P2."
      default: ""
    review_ignore_paths:
      description: "Comma-separated ignore globs. Empty inherits base/default generated-lock exclusions; [] clears."
      default: ""
    review_auto_triggers:
      description: "Comma-separated automatic events. Native MR pipelines infer opened or synchronize; empty inherits defaults."
      default: ""
    review_drafts:
      description: "Automatically review draft MRs. Default: false."
      default: ""
    review_effort:
      description: "Include evidence-backed review effort. Default: false."
      default: ""
    review_category_chips:
      description: "Include category labels. Default: false."
      default: ""
    review_suggest_reviewers:
      description: "Suggest reviewers from trusted base CODEOWNERS, never assign. Default: false."
      default: ""
    review_pre_merge_checks:
      description: "Comma-separated title,description,linked_issue checks. Default: none; [] clears."
      default: ""
    security_severity_threshold:
      description: "Minimum security severity: critical,high,medium,low. Effective default: medium."
      default: ""
    settings:
      description: |
        Droid Exec settings as a JSON string or a path to a JSON file.
        Merged into ~/.factory/droid/settings.json on the runner before
        `droid exec` runs. Mirrors the GitHub action's `settings` input.
      default: ""
    org_guidelines_source:
      description: |
        Where organization-wide review guidelines live. Accepts an
        absolute file path on the runner (e.g. a group-level file-type
        CI/CD variable), an https URL to the raw markdown (same-instance
        URLs authenticate with $CI_JOB_TOKEN and do not follow
        redirects), an https clone URL ending in `.git`, or a GitLab
        project path (e.g. "my-group/review-guidelines") cloned from
        $CI_SERVER_HOST using $CI_JOB_TOKEN
        (add the consuming projects to the guidelines repo's job-token
        allowlist). The guidelines are installed as a user-level
        `org-review-guidelines` skill on the runner, separate from a
        project's own `.factory/skills/review-guidelines` skill; both
        apply, and the project-level skill wins on conflicts.
        Empty = disabled.
      default: ""
    org_guidelines_ref:
      description: |
        Git sources only: branch or tag of the org guidelines repo to
        clone. Empty = the repo's default branch.
      default: ""
    org_guidelines_path:
      description: |
        Git sources only: path of the guidelines markdown file inside
        the org guidelines repo.
      default: "review-guidelines.md"
    droid_action_repo:
      description: |
        Git repo (clone URL) of droid-action. Defaults to the gitlab.com
        mirror so GitLab runners with restricted egress only need
        gitlab.com + app.factory.ai access. Override if you mirror it
        privately.
      default: "https://gitlab.com/factory-components/droid-action.git"
    droid_action_ref:
      description: |
        Git tag or branch of droid-action to clone at runtime (SHAs are
        not supported because the clone uses `--branch`). The same ref
        SHOULD match the `include: remote:` URL above.
        Internal: most users leave this at the default.
      default: "main"
    stage:
      description: |
        GitLab CI stage to assign the droid-review job to. The consuming
        project's `.gitlab-ci.yml` must include this stage in its
        `stages:` list (or omit the list to use the default ordering).
      default: "test"
---
droid-review:
  stage: $[[ inputs.stage ]]
  image: oven/bun:1.2.11
  resource_group: "droid-review-$CI_MERGE_REQUEST_IID"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$DROID_TRIGGER_NOTE_ID && $CI_MERGE_REQUEST_IID && ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")'
  variables:
    # Outside the worktree on purpose: the MR being reviewed is checked out
    # into CI_PROJECT_DIR, so a branch that commits `.droid-state.json` as a
    # symlink could otherwise redirect this write to an arbitrary path.
    DROID_STATE_FILE: "/tmp/droid-prompts/.droid-state.json"
    DROID_PROMPT_FILE: "/tmp/droid-prompts/droid-prompt.txt"
    DROID_ACTION_DIR: "/tmp/droid-action"
    DROID_ACTION_REPO: "$[[ inputs.droid_action_repo ]]"
    DROID_ACTION_REF: "$[[ inputs.droid_action_ref ]]"
    AUTOMATIC_REVIEW: "$[[ inputs.automatic_review ]]"
    REVIEW_DEPTH: "$[[ inputs.review_depth ]]"
    REVIEW_MODEL: "$[[ inputs.review_model ]]"
    REASONING_EFFORT: "$[[ inputs.reasoning_effort ]]"
    INCLUDE_SUGGESTIONS: "$[[ inputs.include_suggestions ]]"
    AUTOMATIC_SECURITY_REVIEW: "$[[ inputs.automatic_security_review ]]"
    SECURITY_BLOCK_ON_CRITICAL: "$[[ inputs.security_block_on_critical ]]"
    SECURITY_BLOCK_ON_HIGH: "$[[ inputs.security_block_on_high ]]"
    DROID_SETTINGS: "$[[ inputs.settings ]]"
    ORG_GUIDELINES_SOURCE: "$[[ inputs.org_guidelines_source ]]"
    ORG_GUIDELINES_REF: "$[[ inputs.org_guidelines_ref ]]"
    ORG_GUIDELINES_PATH: "$[[ inputs.org_guidelines_path ]]"
    REVIEW_UX_V2: "true"
    REVIEW_SUMMARY: "$[[ inputs.review_summary ]]"
    REVIEW_SUMMARY_SECTIONS: "$[[ inputs.review_summary_sections ]]"
    REVIEW_BADGES: "$[[ inputs.review_badges ]]"
    REVIEW_REACTIONS: "$[[ inputs.review_reactions ]]"
    REVIEW_CHECK_RUN: "$[[ inputs.review_check_run ]]"
    FAIL_ON_SEVERITY: "$[[ inputs.fail_on_severity ]]"
    REVIEW_INCREMENTAL: "$[[ inputs.review_incremental ]]"
    REVIEW_AUTO_RESOLVE: "$[[ inputs.review_auto_resolve ]]"
    REVIEW_MAX_AUTO_RUNS: "$[[ inputs.review_max_auto_runs ]]"
    SHOW_DROPPED_FINDINGS: "$[[ inputs.show_dropped_findings ]]"
    INCLUDE_AGENT_PROMPTS: "$[[ inputs.include_agent_prompts ]]"
    FIX_MODE: "$[[ inputs.fix_mode ]]"
    REVIEW_DIAGRAM: "$[[ inputs.review_diagram ]]"
    REVIEW_SEVERITY_THRESHOLD: "$[[ inputs.review_severity_threshold ]]"
    REVIEW_IGNORE_PATHS: "$[[ inputs.review_ignore_paths ]]"
    REVIEW_AUTO_TRIGGERS: "$[[ inputs.review_auto_triggers ]]"
    REVIEW_DRAFTS: "$[[ inputs.review_drafts ]]"
    REVIEW_EFFORT: "$[[ inputs.review_effort ]]"
    REVIEW_CATEGORY_CHIPS: "$[[ inputs.review_category_chips ]]"
    REVIEW_SUGGEST_REVIEWERS: "$[[ inputs.review_suggest_reviewers ]]"
    REVIEW_PRE_MERGE_CHECKS: "$[[ inputs.review_pre_merge_checks ]]"
    SECURITY_SEVERITY_THRESHOLD: "$[[ inputs.security_severity_threshold ]]"
    DROID_SUCCESS: "true"
  before_script:
    - apt-get update -qq
    # procps provides `ps`, which droid uses to find and stop child
    # processes (subagents, background commands, MCP servers).
    - apt-get install -y -qq --no-install-recommends git ca-certificates curl procps
    - git clone --depth 1 --branch "$DROID_ACTION_REF" "$DROID_ACTION_REPO" "$DROID_ACTION_DIR"
    - cd "$DROID_ACTION_DIR" && bun install --frozen-lockfile
    # From here on the working directory is the untrusted MR checkout.
    - cd "$CI_PROJECT_DIR"
    - curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - droid --version
    # Copy bundled custom droids (e.g. security-reviewer) into the runner's
    # ~/.factory/droids so the Skill / Task subagents can find them. Mirrors
    # the GitHub action's "Setup Custom Droids" step.
    - mkdir -p ~/.factory/droids
    - |
      if [ -d "$DROID_ACTION_DIR/.factory/droids" ]; then
        cp -r "$DROID_ACTION_DIR/.factory/droids/." ~/.factory/droids/
        echo "Copied custom droids from $DROID_ACTION_DIR/.factory/droids to ~/.factory/droids"
      fi
    # Install org-wide review guidelines (if configured) as a user-level
    # `org-review-guidelines` skill so they apply alongside, and never
    # shadow, a project's own `.factory/skills/review-guidelines` skill.
    - bash "$DROID_ACTION_DIR/gitlab/install-org-guidelines.sh"
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      set -euo pipefail
      # Freeze every credentialed adapter and executable before any model runs.
      # Keep integrity authority in this parent, not model-writable state.
      . "$DROID_ACTION_DIR/gitlab/freeze-runtime.sh"
      droid_freeze_runtime
      droid_install_finalize_trap
    # Every `bun run` passes --config=/dev/null --env-file=/dev/null: the
    # working directory is the MR checkout, and Bun would otherwise load its
    # `bunfig.toml` (including `preload` scripts) and `.env` while
    # GITLAB_TOKEN and FACTORY_API_KEY are in the environment.
    - |
      if ! droid_run_trusted gitlab-prepare; then
        export DROID_SUCCESS=false
        echo "gitlab-prepare exited non-zero" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # Skip droid exec if prepare decided not to review.
      if ! grep -q '"shouldRunReview": true' "$DROID_STATE_FILE"; then
        echo "shouldRunReview=false in state; skipping droid exec."
        exit 0
      fi
    - |
      # Source the resolved env shim from gitlab-prepare to expose
      # RESOLVED_MODEL / RESOLVED_REASONING_EFFORT and the per-pass
      # DROID_SESSION_TAG_* JSON for the droid exec calls, plus
      # DROID_MR_IID / DROID_TRACKING_NOTE_ID for any extra steps a
      # consuming project bolts onto this job.
      # Resolve the same path gitlab-prepare wrote it to, so overriding
      # DROID_PROMPT_FILE or DROID_RESOLVED_ENV_FILE keeps working.
      RESOLVED_ENV_SHIM="${DROID_RESOLVED_ENV_FILE:-$(dirname "$DROID_PROMPT_FILE")/resolved-env.sh}"
      if [ -f "$RESOLVED_ENV_SHIM" ]; then
        # shellcheck disable=SC1091
        . "$RESOLVED_ENV_SHIM"
      fi
    - |
      # ---- Pass 1: candidate generation ----
      # Pass 1 must only WRITE the candidates JSON; it gets no tool that
      # can reach GitLab.
      set -o pipefail
      PASS1_TOOLS="Read,Grep,Glob,LS,Execute,Edit,Create,ApplyPatch,Task,Skill,FetchUrl"
      PASS1_LOG="/tmp/droid-prompts/pass1-output.jsonl"
      DROID_ARGS="exec -f $DROID_PROMPT_FILE --enabled-tools $PASS1_TOOLS --output-format stream-json --skip-permissions-unsafe"
      if [ -n "$RESOLVED_MODEL" ]; then DROID_ARGS="$DROID_ARGS --model $RESOLVED_MODEL"; fi
      if [ -n "$RESOLVED_REASONING_EFFORT" ]; then DROID_ARGS="$DROID_ARGS --reasoning-effort $RESOLVED_REASONING_EFFORT"; fi
      # The session tag is JSON, so it is passed as its own quoted argument
      # rather than through the word-split DROID_ARGS string. Falls back to
      # the bare tag name when the shim came from an older gitlab-prepare.
      SESSION_TAG="${DROID_SESSION_TAG_CANDIDATES:-code-review}"
      echo "Running Pass 1 (candidates): droid $DROID_ARGS --tag '$SESSION_TAG'"
      # The pass never needs the GitLab token, so it does not start with it.
      # This is hygiene, not isolation: the pass can still read the token from
      # this shell's /proc/<pid>/environ.
      droid_verify_cli
      if ! env -u GITLAB_TOKEN -u OVERRIDE_GITLAB_TOKEN -u CI_JOB_TOKEN -u CI_REPOSITORY_URL -u BUN_OPTIONS -u NODE_OPTIONS "$DROID_FROZEN_CLI" $DROID_ARGS --tag "$SESSION_TAG" 2>&1 | tee "$PASS1_LOG"; then
        export DROID_SUCCESS=false
        echo "droid exec pass 1 (candidates) failed" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # ---- Prepare Pass 2 prompt ----
      if ! droid_run_trusted gitlab-prepare-validator; then
        export DROID_SUCCESS=false
        echo "gitlab-prepare-validator failed" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # ---- Pass 2: validator (writes review_validated.json) ----
      # Pass 2 decides which candidates survive and writes the validated
      # JSON. Posting happens in the next step, from CI, so this pass gets
      # no MR-mutation tool either.
      set -o pipefail
      PASS2_TOOLS="Read,Grep,Glob,LS,Execute,Edit,Create,ApplyPatch,Skill"
      PASS2_LOG="/tmp/droid-prompts/pass2-output.jsonl"
      DROID_ARGS="exec -f $DROID_PROMPT_FILE --enabled-tools $PASS2_TOOLS --output-format stream-json --skip-permissions-unsafe"
      if [ -n "$RESOLVED_MODEL" ]; then DROID_ARGS="$DROID_ARGS --model $RESOLVED_MODEL"; fi
      if [ -n "$RESOLVED_REASONING_EFFORT" ]; then DROID_ARGS="$DROID_ARGS --reasoning-effort $RESOLVED_REASONING_EFFORT"; fi
      SESSION_TAG="${DROID_SESSION_TAG_VALIDATOR:-code-review}"
      echo "Running Pass 2 (validator): droid $DROID_ARGS --tag '$SESSION_TAG'"
      droid_verify_cli
      if ! env -u GITLAB_TOKEN -u OVERRIDE_GITLAB_TOKEN -u CI_JOB_TOKEN -u CI_REPOSITORY_URL -u BUN_OPTIONS -u NODE_OPTIONS "$DROID_FROZEN_CLI" $DROID_ARGS --tag "$SESSION_TAG" 2>&1 | tee "$PASS2_LOG"; then
        export DROID_SUCCESS=false
        echo "droid exec pass 2 (validator) failed" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # ---- Post the approved findings via the GitLab REST API ----
      # Reads review_validated.json and creates one inline discussion per
      # approved comment. Comments that cannot be anchored are reported in
      # the job log and counted in the tracking note.
      if ! droid_run_trusted gitlab-post-review; then
        export DROID_SUCCESS=false
        echo "gitlab-post-review failed to post the review" > /tmp/droid-error.txt
        exit 1
      fi
  # Finalization runs in the same parent's EXIT trap, preserving its pinned
  # digests and original exit status. A fresh after_script has no authority.
  after_script: []
  artifacts:
    when: always
    paths:
      # The state file now lives in /tmp/droid-prompts, so it is staged into
      # .droid-debug/prompts/ along with the rest of the debug output.
      - .droid-debug/
    expire_in: 1 week
