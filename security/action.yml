name: "Droid Security Review"
description: "Run Droid security review on a PR"

inputs:
  # Empty config-enabled inputs mean omitted. Effective defaults are documented
  # below and resolved as built-in defaults < base .factory/review.yaml < inputs.
  factory_api_key:
    description: "Factory API key"
    required: true
  github_token:
    description: "GitHub token (optional - will use OIDC if not provided)"
    required: false
    default: ""
  worker_token:
    description: "GitHub token that can read the droid-review release the review's worker is downloaded from. Given only to the step that downloads it, which ends before the review starts."
    required: true
  tracking_comment_id:
    description: "ID of the tracking comment to update"
    required: true
  security_model:
    description: "Advanced. Leave empty to use the review_depth preset (recommended). If set, use a provider tier alias such as 'openai-latest-premium' or 'anthropic-latest-balanced'."
    required: false
    default: ""
  security_severity_threshold:
    description: "Minimum security severity: critical, high, medium (effective default), or low. Empty inherits base config."
    required: false
    default: ""
  security_block_on_critical:
    description: "Fail the check run for critical security findings, never request changes. Effective default true."
    required: false
    default: ""
  security_block_on_high:
    description: "Fail the check run for high security findings, never request changes. Effective default false."
    required: false
    default: ""
  review_validated_path:
    description: "Path the review's answer is written to, which the publishing step reads."
    required: false
    default: "${{ runner.temp }}/droid-prompts/review_validated.json"
  review_depth:
    description: "Review depth: deep (effective default) or shallow. Empty inherits base-branch config; unknown values warn and use deep."
    required: false
    default: ""
  review_model:
    description: "Advanced. Leave empty to use the review_depth preset (recommended)."
    required: false
    default: ""
  reasoning_effort:
    description: "Advanced. Leave empty to use the review_depth preset (recommended)."
    required: false
    default: ""
  include_suggestions:
    description: "Include code suggestion blocks in review comments."
    required: false
    default: "false"

  review_summary:
    description: "Summary location: comment (effective default), description, or off. Empty inherits base-branch config."
    required: false
    default: ""
  review_summary_sections:
    description: "Visible sections. Effective default: verdict,findings,changes,details; also diagram,risk,effort. Empty inherits base config; [] disables optional sections."
    required: false
    default: ""
  review_badges:
    description: "Severity badges: image (effective default), emoji, or text. Empty inherits base config."
    required: false
    default: ""
  review_reactions:
    description: "Lifecycle reactions: eyes while running, hooray when clean, confused on failure. Effective default true; no thumbs-up/down."
    required: false
    default: ""
  review_check_run:
    description: "Create the Droid Review check run with the caller token. Effective default true; missing checks write warns once."
    required: false
    default: ""
  fail_on_severity:
    description: "Fail the check at or above P0, P1, or P2. Effective default empty (no priority gate); off explicitly disables a base-config gate."
    required: false
    default: ""
  review_incremental:
    description: "Review only new commits after the first run. Effective default true; empty inherits base config."
    required: false
    default: ""
  review_auto_resolve:
    description: "Resolve verified fixed Droid threads. Effective default true; empty inherits base config."
    required: false
    default: ""
  review_max_auto_runs:
    description: "Auto-pause after this many automatic reviews. Effective default 0 (unlimited); explicit 0 overrides base config."
    required: false
    default: ""
  show_dropped_findings:
    description: "List validation-dropped candidates and reasons. Effective default false; empty inherits base config."
    required: false
    default: ""
  include_agent_prompts:
    description: "Include untrusted-data-safe AI agent prompts. Effective default true; empty inherits base config."
    required: false
    default: ""
  fix_mode:
    description: "Droid fix publishing mode: commit (effective default), pr, or off. Commit falls back to an authorized stacked PR for protected branches; inaccessible forks are refused."
    required: false
    default: ""
  review_diagram:
    description: "What changed diagram: auto (effective default) or off. Empty inherits base config."
    required: false
    default: ""
  review_severity_threshold:
    description: "Minimum reported finding priority: P0, P1, or P2 (effective default). Empty inherits base config."
    required: false
    default: ""
  review_ignore_paths:
    description: "Comma/newline-separated ignored globs. Effective default generated files, dist/build/coverage and lock files; [] disables ignores. Empty inherits base config."
    required: false
    default: ""
  review_auto_triggers:
    description: "Automatic PR event actions. Effective default opened,reopened,synchronize,ready_for_review. [] disables automatic event triggers."
    required: false
    default: ""
  review_drafts:
    description: "Review draft PRs automatically. Effective default false; manual review commands still run."
    required: false
    default: ""
  review_effort:
    description: "Show an evidence-based effort estimate. Effective default false; empty inherits base config."
    required: false
    default: ""
  review_category_chips:
    description: "Show finding category chips. Effective default false; empty inherits base config."
    required: false
    default: ""
  review_suggest_reviewers:
    description: "Suggest CODEOWNERS reviewers, never assign them. Effective default false."
    required: false
    default: ""
  review_pre_merge_checks:
    description: "Opt-in checks: title,description,linked_issue. Effective default none; [] explicitly clears base checks."
    required: false
    default: ""
  automatic_review:
    description: "Run automatic code review without a mention. Effective default false; empty inherits base config."
    required: false
    default: ""
  automatic_security_review:
    description: "Run automatic security review. Effective default inherits automatic_review; explicit false opts out."
    required: false
    default: ""

outputs:
  conclusion:
    description: "Review conclusion (success/failure)"
    value: ${{ steps.post_review.outputs.conclusion || steps.review.outputs.conclusion }}

runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      with:
        bun-version: 1.2.11

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}/..
        bun install

    - name: Install Droid CLI
      shell: bash
      run: |
        curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/droid" --version

    # Every `bun run` passes --config=/dev/null --env-file=/dev/null so Bun
    # does not load bunfig.toml (preload scripts) or .env files from the
    # caller's checkout into a process holding the job's credentials.
    - name: Get GitHub Token
      id: token
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        bun --config=/dev/null --env-file=/dev/null run ${{ github.action_path }}/../src/entrypoints/get-token.ts
      env:
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        FACTORY_API_KEY: ${{ inputs.factory_api_key }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        # Enough to fetch the PR's commits, read it, and post the review and comments.
        APP_TOKEN_PERMISSIONS: '{"contents":"read","pull_requests":"write"}'

    - name: Prepare security review
      id: prepare
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        bun --config=/dev/null --env-file=/dev/null run ${{ github.action_path }}/../src/entrypoints/prepare-review.ts
      env:
        REVIEW_CONFIG_JSON: ""
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        GITHUB_TOKEN: ${{ steps.token.outputs.github_token }}
        DROID_COMMENT_ID: ${{ inputs.tracking_comment_id }}
        SECURITY_MODEL: ${{ inputs.security_model }}
        REVIEW_MODEL: ${{ inputs.review_model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        SECURITY_SEVERITY_THRESHOLD: ${{ inputs.security_severity_threshold }}
        SECURITY_BLOCK_ON_CRITICAL: ${{ inputs.security_block_on_critical }}
        SECURITY_BLOCK_ON_HIGH: ${{ inputs.security_block_on_high }}
        REVIEW_TYPE: "security"
        INCLUDE_SUGGESTIONS: ${{ inputs.include_suggestions }}

        REVIEW_DEPTH: ${{ inputs.review_depth }}
        REVIEW_SUMMARY: ${{ inputs.review_summary }}
        REVIEW_SUMMARY_SECTIONS: ${{ inputs.review_summary_sections }}
        REVIEW_BADGES: ${{ inputs.review_badges }}
        REVIEW_REACTIONS: ${{ inputs.review_reactions }}
        REVIEW_CHECK_RUN: ${{ inputs.review_check_run }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        REVIEW_INCREMENTAL: ${{ inputs.review_incremental }}
        REVIEW_AUTO_RESOLVE: ${{ inputs.review_auto_resolve }}
        REVIEW_MAX_AUTO_RUNS: ${{ inputs.review_max_auto_runs }}
        SHOW_DROPPED_FINDINGS: ${{ inputs.show_dropped_findings }}
        INCLUDE_AGENT_PROMPTS: ${{ inputs.include_agent_prompts }}
        FIX_MODE: ${{ inputs.fix_mode }}
        REVIEW_DIAGRAM: ${{ inputs.review_diagram }}
        REVIEW_SEVERITY_THRESHOLD: ${{ inputs.review_severity_threshold }}
        REVIEW_IGNORE_PATHS: ${{ inputs.review_ignore_paths }}
        REVIEW_AUTO_TRIGGERS: ${{ inputs.review_auto_triggers }}
        REVIEW_DRAFTS: ${{ inputs.review_drafts }}
        REVIEW_EFFORT: ${{ inputs.review_effort }}
        REVIEW_CATEGORY_CHIPS: ${{ inputs.review_category_chips }}
        REVIEW_SUGGEST_REVIEWERS: ${{ inputs.review_suggest_reviewers }}
        REVIEW_PRE_MERGE_CHECKS: ${{ inputs.review_pre_merge_checks }}
        AUTOMATIC_REVIEW: ${{ inputs.automatic_review }}
        AUTOMATIC_SECURITY_REVIEW: ${{ inputs.automatic_security_review }}
        WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        ALL_INPUTS: ${{ toJson(inputs) }}
    - name: Freeze trusted Droid executable
      id: review_cli
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        bun --config=/dev/null --env-file=/dev/null run ${{ github.action_path }}/../src/entrypoints/freeze-review-cli.ts
      env:
        BASH_ENV: ""
        ENV: ""
        NODE_OPTIONS: ""
        BUN_OPTIONS: ""
        NODE_PATH: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""

    # The one step that is given the worker token. It downloads the
    # droid-review worker, and the judge a review will run with, to files only
    # the job's user can read, and ends before any step that starts a session,
    # so no process that runs pull request code is given the token. A failed
    # download writes nothing and is a warning here: the step that finds no
    # file it can use reports that.
    - name: Download the worker
      if: steps.prepare.outputs.review_skipped != 'true'
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        bun --config=/dev/null --env-file=/dev/null run ${{ github.action_path }}/../src/entrypoints/worker-download.ts
      env:
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        WORKER_TOKEN: ${{ inputs.worker_token }}
        WORKER_DIR: ${{ runner.temp }}/droid-worker
        REVIEW_JUDGE: security

    - name: Review lifecycle reviewing
      if: steps.prepare.outputs.review_skipped != 'true'
      continue-on-error: true
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        # Execute only the publisher and runtime frozen before model execution.
        for path in "$REVIEW_PUBLISHER_PATH" "$REVIEW_RUNTIME_PATH"; do
          case "$path" in /*) ;; *) echo "Refusing a non-absolute review executable"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "Refusing a missing or symlinked review executable"
            exit 1
          fi
        done
        if [[ ! "$REVIEW_PUBLISHER_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$REVIEW_RUNTIME_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Missing trusted review executable digest"
          exit 1
        fi
        if [ -x /usr/bin/sha256sum ]; then
          digest_command=(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/sha256sum --)
        elif [ -x /usr/bin/shasum ]; then
          digest_command=(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/shasum -a256 --)
        else
          echo "No trusted SHA-256 verifier is available; refusing execution"
          exit 1
        fi
        publisher_hash=$("${digest_command[@]}" "$REVIEW_PUBLISHER_PATH")
        runtime_hash=$("${digest_command[@]}" "$REVIEW_RUNTIME_PATH")
        if [ "${publisher_hash%% *}" != "$REVIEW_PUBLISHER_SHA256" ] || [ "${runtime_hash%% *}" != "$REVIEW_RUNTIME_SHA256" ]; then
          echo "Review publisher or runtime changed during execution; refusing to publish"
          exit 1
        fi
        /usr/bin/env -i \
          DROID_EXEC_RUN_TYPE="${DROID_EXEC_RUN_TYPE:-}" \
          PATH=/usr/bin:/bin \
          GITHUB_OUTPUT="${GITHUB_OUTPUT:-}" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH:-}" \
          RUNNER_TEMP="${RUNNER_TEMP:-}" \
          GITHUB_ACTOR="${GITHUB_ACTOR:-}" \
          GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
          GITHUB_RUN_ID="${GITHUB_RUN_ID:-}" \
          GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-}" \
          GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}" \
          GITHUB_SERVER_URL="${GITHUB_SERVER_URL:-}" \
          GITHUB_API_URL="${GITHUB_API_URL:-}" \
          REVIEW_RUNTIME_SHA256="${REVIEW_RUNTIME_SHA256:-}" \
          REVIEW_RUNTIME_PATH="${REVIEW_RUNTIME_PATH:-}" \
          REVIEW_PUBLISHER_SHA256="${REVIEW_PUBLISHER_SHA256:-}" \
          REVIEW_PUBLISHER_PATH="${REVIEW_PUBLISHER_PATH:-}" \
          REVIEW_SKIPPED="${REVIEW_SKIPPED:-}" \
          REVIEW_POSTED="${REVIEW_POSTED:-}" \
          REVIEW_AUTOMATIC="${REVIEW_AUTOMATIC:-}" \
          REVIEW_SECURITY_ONLY="${REVIEW_SECURITY_ONLY:-}" \
          REVIEW_INCREMENTAL_BASE_SHA="${REVIEW_INCREMENTAL_BASE_SHA:-}" \
          REVIEW_CONFIG_JSON="${REVIEW_CONFIG_JSON:-}" \
          REVIEW_REACTION_KIND="${REVIEW_REACTION_KIND:-}" \
          REVIEW_REACTION_TARGET="${REVIEW_REACTION_TARGET:-}" \
          REVIEW_REACTION_ID="${REVIEW_REACTION_ID:-}" \
          REVIEW_STARTED_AT="${REVIEW_STARTED_AT:-}" \
          REVIEW_CHECK_ID="${REVIEW_CHECK_ID:-}" \
          REVIEW_COMMENT_ID="${REVIEW_COMMENT_ID:-}" \
          REVIEW_BASE_SHA="${REVIEW_BASE_SHA:-}" \
          REPO_OWNER="${REPO_OWNER:-}" \
          REPO_NAME="${REPO_NAME:-}" \
          PR_NUMBER="${PR_NUMBER:-}" \
          REVIEW_HEAD_SHA="${REVIEW_HEAD_SHA:-}" \
          GITHUB_TOKEN="${GITHUB_TOKEN:-}" \
          WORKFLOW_GITHUB_TOKEN="${WORKFLOW_GITHUB_TOKEN:-}" \
          REVIEW_PHASE="${REVIEW_PHASE:-}" \
          "$REVIEW_RUNTIME_PATH" --config=/dev/null --env-file=/dev/null run "$REVIEW_PUBLISHER_PATH"
      env:
        DROID_EXEC_RUN_TYPE: ${{ steps.prepare.outputs.droid_exec_run_type }}
        RUNNER_TEMP: ${{ runner.temp }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        REVIEW_RUNTIME_SHA256: ${{ steps.prepare.outputs.review_runtime_sha256 }}
        REVIEW_RUNTIME_PATH: ${{ steps.prepare.outputs.review_runtime_path }}
        REVIEW_PUBLISHER_SHA256: ${{ steps.prepare.outputs.review_lifecycle_publisher_sha256 }}
        REVIEW_PUBLISHER_PATH: ${{ steps.prepare.outputs.review_lifecycle_publisher_path }}
        REVIEW_SKIPPED: ${{ steps.prepare.outputs.review_skipped }}
        REVIEW_POSTED: ${{ steps.post_review.outputs.review_posted }}
        REVIEW_AUTOMATIC: ${{ steps.prepare.outputs.review_automatic }}
        REVIEW_SECURITY_ONLY: ${{ steps.prepare.outputs.review_security_only }}
        REVIEW_INCREMENTAL_BASE_SHA: ${{ steps.prepare.outputs.review_incremental_base_sha }}
        REVIEW_CONFIG_JSON: ${{ steps.prepare.outputs.review_config_json }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        REVIEW_REACTION_KIND: ${{ steps.prepare.outputs.review_reaction_kind }}
        REVIEW_REACTION_TARGET: ${{ steps.prepare.outputs.review_reaction_target }}
        REVIEW_REACTION_ID: ${{ steps.prepare.outputs.review_reaction_id }}
        REVIEW_STARTED_AT: ${{ steps.prepare.outputs.review_started_at }}
        REVIEW_CHECK_ID: ${{ steps.prepare.outputs.review_check_id }}
        REVIEW_COMMENT_ID: ${{ steps.prepare.outputs.review_comment_id }}
        REVIEW_BASE_SHA: ${{ steps.prepare.outputs.review_base_sha }}
        REPO_OWNER: ${{ steps.prepare.outputs.repo_owner }}
        REPO_NAME: ${{ steps.prepare.outputs.repo_name }}
        PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        REVIEW_HEAD_SHA: ${{ steps.prepare.outputs.review_head_sha }}
        GITHUB_TOKEN: ${{ steps.token.outputs.github_token }}
        WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        REVIEW_PHASE: reviewing

    # The one step of a review that starts a model session. Both of its passes
    # run pull request code, so it is given the Factory key and no GitHub or
    # download token, in an environment holding only what is named here. An
    # answer is left at REVIEW_VALIDATED_PATH for the publishing step. Every
    # other ending is `conclusion: failure` with a sentence saying why, and
    # the step itself still succeeds, so the steps after it read its outputs.
    - name: Run review
      id: review
      if: steps.prepare.outputs.review_skipped != 'true'
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        # Execute only the script, runtime and Droid executable frozen before this step.
        for path in "$TRUSTED_TAIL_PATH" "$TRUSTED_RUNTIME_PATH"; do
          case "$path" in /*) ;; *) echo "Refusing a non-absolute review executable"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "Refusing a missing or symlinked review executable"
            exit 1
          fi
        done
        if [[ ! "$TRUSTED_TAIL_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$TRUSTED_RUNTIME_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Missing trusted review executable digest"
          exit 1
        fi
        if [ -x /usr/bin/sha256sum ]; then
          digest_command=(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/sha256sum --)
        elif [ -x /usr/bin/shasum ]; then
          digest_command=(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/shasum -a256 --)
        else
          echo "No trusted SHA-256 verifier is available; refusing execution"
          exit 1
        fi
        tail_hash=$("${digest_command[@]}" "$TRUSTED_TAIL_PATH")
        runtime_hash=$("${digest_command[@]}" "$TRUSTED_RUNTIME_PATH")
        if [ "${tail_hash%% *}" != "$TRUSTED_TAIL_SHA256" ] || [ "${runtime_hash%% *}" != "$TRUSTED_RUNTIME_SHA256" ]; then
          echo "Review script or runtime changed during execution; refusing to run the review"
          exit 1
        fi
        case "$REVIEW_CLI_PATH" in /*) ;; *) echo "Refusing a non-absolute Droid executable"; exit 1 ;; esac
        if [ ! -f "$REVIEW_CLI_PATH" ] || [ -L "$REVIEW_CLI_PATH" ] || [[ ! "$REVIEW_CLI_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Missing trusted Droid executable"
          exit 1
        fi
        cli_hash=$("${digest_command[@]}" "$REVIEW_CLI_PATH")
        if [ "${cli_hash%% *}" != "$REVIEW_CLI_SHA256" ]; then
          echo "Droid executable changed during execution; refusing to run the review"
          exit 1
        fi
        /usr/bin/env -i \
          PATH="$PATH" \
          HOME="${HOME:-}" \
          GITHUB_OUTPUT="${GITHUB_OUTPUT:-}" \
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE:-}" \
          RUNNER_TEMP="${RUNNER_TEMP:-}" \
          WORKER_DIR="${WORKER_DIR:-}" \
          DROID_BIN="$REVIEW_CLI_PATH" \
          FACTORY_API_KEY="${FACTORY_API_KEY:-}" \
          REVIEW_HEAD_SHA="${REVIEW_HEAD_SHA:-}" \
          REVIEW_BASE_SHA="${REVIEW_BASE_SHA:-}" \
          REVIEW_SECURITY_ONLY="${REVIEW_SECURITY_ONLY:-}" \
          REVIEW_VALIDATED_PATH="${REVIEW_VALIDATED_PATH:-}" \
          "$TRUSTED_RUNTIME_PATH" --config=/dev/null --env-file=/dev/null run "$TRUSTED_TAIL_PATH"
      env:
        HOME: ${{ steps.review_cli.outputs.review_home }}
        PATH: ${{ steps.review_cli.outputs.review_path }}
        REVIEW_CLI_SHA256: ${{ steps.review_cli.outputs.review_cli_sha256 }}
        REVIEW_CLI_PATH: ${{ steps.review_cli.outputs.review_cli_path }}
        TRUSTED_RUNTIME_SHA256: ${{ steps.prepare.outputs.review_runtime_sha256 }}
        TRUSTED_RUNTIME_PATH: ${{ steps.prepare.outputs.review_runtime_path }}
        TRUSTED_TAIL_SHA256: ${{ steps.prepare.outputs.review_run_publisher_sha256 }}
        TRUSTED_TAIL_PATH: ${{ steps.prepare.outputs.review_run_publisher_path }}
        LD_AUDIT: ""
        LD_LIBRARY_PATH: ""
        LD_PRELOAD: ""
        NODE_PATH: ""
        BUN_OPTIONS: ""
        NODE_OPTIONS: ""
        ENV: ""
        BASH_ENV: ""
        RUNNER_TEMP: ${{ runner.temp }}
        WORKER_DIR: ${{ runner.temp }}/droid-worker
        FACTORY_API_KEY: ${{ inputs.factory_api_key }}
        REVIEW_HEAD_SHA: ${{ steps.prepare.outputs.review_head_sha }}
        REVIEW_BASE_SHA: ${{ steps.prepare.outputs.review_base_sha }}
        REVIEW_SECURITY_ONLY: ${{ steps.prepare.outputs.review_security_only }}
        REVIEW_VALIDATED_PATH: ${{ inputs.review_validated_path }}

    - name: Post Review
      id: post_review
      if: steps.prepare.outputs.review_skipped != 'true' && steps.review.outputs.conclusion == 'success'
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      run: |
        set -euo pipefail
        # Execute only the publisher and runtime frozen before model execution.
        for path in "$REVIEW_PUBLISHER_PATH" "$REVIEW_RUNTIME_PATH"; do
          case "$path" in /*) ;; *) echo "Refusing a non-absolute review executable"; exit 1 ;; esac
          if [ ! -f "$path" ] || [ -L "$path" ]; then
            echo "Refusing a missing or symlinked review executable"
            exit 1
          fi
        done
        if [[ ! "$REVIEW_PUBLISHER_SHA256" =~ ^[a-f0-9]{64}$ ]] || [[ ! "$REVIEW_RUNTIME_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Missing trusted review executable digest"
          exit 1
        fi
        if [ -x /usr/bin/sha256sum ]; then
          digest_command=(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/sha256sum --)
        elif [ -x /usr/bin/shasum ]; then
          digest_command=(/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/shasum -a256 --)
        else
          echo "No trusted SHA-256 verifier is available; refusing execution"
          exit 1
        fi
        publisher_hash=$("${digest_command[@]}" "$REVIEW_PUBLISHER_PATH")
        runtime_hash=$("${digest_command[@]}" "$REVIEW_RUNTIME_PATH")
        if [ "${publisher_hash%% *}" != "$REVIEW_PUBLISHER_SHA256" ] || [ "${runtime_hash%% *}" != "$REVIEW_RUNTIME_SHA256" ]; then
          echo "Review publisher or runtime changed during execution; refusing to publish"
          exit 1
        fi
        /usr/bin/env -i \
          DROID_EXEC_RUN_TYPE="${DROID_EXEC_RUN_TYPE:-}" \
          PATH=/usr/bin:/bin \
          GITHUB_OUTPUT="${GITHUB_OUTPUT:-}" GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-}" GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH:-}" \
          RUNNER_TEMP="${RUNNER_TEMP:-}" \
          GITHUB_ACTOR="${GITHUB_ACTOR:-}" \
          GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" \
          GITHUB_RUN_ID="${GITHUB_RUN_ID:-}" \
